<style>
/* Style_Dasar — Dasar: variabel warna, tata letak, login, tabel, kartu, modal */
:root{color-scheme:light;--nv:#0b3a8c;--nv2:#0a2d70;--or:#f26b1d;--bg:#f3f5fa;--cd:#fff;--tx:#14213d;--mu:#667085;--bd:#e3e8f2;--ok:#12a150;--rd:#e4001b;--am:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--cd);padding:8px 14px;border-radius:10px;cursor:pointer}
button.pri{background:var(--nv);color:#fff;border-color:var(--nv);font-weight:600}button.or{background:var(--or);border-color:var(--or);color:#fff}button.sm{padding:4px 10px;font-size:12px;border-radius:8px}button.dg{color:var(--rd)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--nv),var(--nv2))}
.lc{background:var(--cd);border-radius:24px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 60px #0004}
.lc h1{font-size:22px;margin:14px 0 4px}.lc h1 b{color:var(--or)}.lc p{color:var(--mu);margin:0 0 18px}.lc label{display:block;margin-bottom:12px;font-weight:600;font-size:12px}.lc button{width:100%;padding:12px;border-radius:999px;margin-top:6px}

 const per=CP?'':`<div class="cards">${POOLS.map(p=>{const sd=D.cash.filter(r=>r.pool==p).reduce((a,r)=>a+(r.jenis=='Masuk'?1:-1)*(+r.nominal||0),0);return`<div class="card rk" onclick="CP='${p}';go('cash')"><small>Saldo ${p}</small><b style="font-size:18px">${rp(sd)}</b></div>`}).join('')}</div>`;
 return ch+per+`<div class="cards"><div class="card"><small>Kas Masuk ${CP||'(Gabungan)'}</small><b>${rp(t.m)}</b></div><div class="card"><small>Kas Keluar ${CP||'(Gabungan)'}</small><b>${rp(t.o)}</b></div><div class="card nv"><small>Saldo ${CP||'Gabungan'}</small><b>${rp(t.s)}</b></div></div>`}

 return`<select id="${id}" hidden${oc?` onchange="${oc}"`:''}>${ph===false?'':'<option value="">— pilih —</option>'}${a.map(x=>`<option value="${esc(x[0])}"${x[0]==v?' selected':''}>${esc(x[1])}</option>`).join('')}</select><button type="button" class="pk" id="${id}_b" onclick="pk('${id}')"><span>${lab?esc(lab):'— pilih —'}</span>${ic('down',16)}</button>`};

 if(t=='alat')return SEL('f_'+n,D.alat.filter(a=>a.kode==v||['Baik','Perlu Perbaikan'].includes(a.kondisi)).map(a=>[a.kode,`${a.kode} · ${a.nama} (tersedia ${avail(a.kode)})`]),v);

function frm(k,id,pre){if(k=='guc')return gucForm(id);const m=M[k],o={...(D[k].find(r=>r.id==id)||{}),...(pre||{})},G=k=='wo'&&!id?WGRP1:m.grp;if(!id&&k=='wo'){if(!o.status)o.status='Storing';o.sumber=o.sumber||'Manual'}if(!id&&k=='cash'&&CP&&!o.pool)o.pool=CP;if(!id&&k=='toolkit'){o.status=o.status||'Dipegang';o.kondisi=o.kondisi||'Baik';o.jumlah=o.jumlah||1}if(!id&&k=='alat'){o.kondisi=o.kondisi||'Baik';o.std=o.std||'Tidak';o.jumlah=o.jumlah||1}if(!id&&k=='scanlog')o.hasil=o.hasil||'Selesai';

async function sv(k,id){const m=M[k],o=id?{...D[k].find(r=>r.id==id)}:{},was=o.status;m.f.forEach(f=>{if(['virt','hid'].includes(f[2])||!$('#f_'+f[0]))return;o[f[0]]=f[2]=='chk'?[...document.querySelectorAll('#f_'+f[0]+' input:checked')].map(i=>i.value).join('|'):(f[2]=='password'?$('#f_'+f[0]).value:$('#f_'+f[0]).value.trim())});if(k=='users')o.username=String(o.username||'').toLowerCase().replace(/\s+/g,'');if(k=='users'&&D.users.some(u=>u.id!=id&&String(u.username).toLowerCase()==o.username))return toast('Username sudah dipakai');
